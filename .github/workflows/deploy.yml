name: Frontend Deploy (production)

# Intentionally inert until a human wires in the real hosting target
# (Vercel project, or whatever else is chosen) and the required secrets.
# See docs/deploy.md.
#
# Fail-closed contract:
#   1. Manual dispatch only — no auto-deploy on push.
#   2. Waits on the `Frontend CI` workflow's ci-gate for the exact commit
#      being deployed; fails before touching any infrastructure if CI
#      hasn't passed for that SHA.

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "deploy" to confirm you intend to deploy to production'
        required: true

concurrency:
  group: frontend-deploy-production
  cancel-in-progress: false

jobs:
  require-explicit-confirmation:
    name: Require explicit confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "deploy" ]; then
            echo "::error::Production deploy not confirmed. Re-run and type 'deploy' exactly."
            exit 1
          fi

  wait-for-ci:
    name: Verify CI is green for this SHA
    runs-on: ubuntu-latest
    needs: [require-explicit-confirmation]
    steps:
      - uses: actions/checkout@v4
      - name: Check latest Frontend CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sha="${{ github.sha }}"
          status=$(gh run list --workflow=ci.yml --commit "$sha" --json conclusion,status --jq '.[0]')
          echo "Latest CI run for $sha: $status"
          conclusion=$(echo "$status" | jq -r '.conclusion // "missing"')
          run_status=$(echo "$status" | jq -r '.status // "missing"')
          if [ "$run_status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Frontend CI has not passed for commit $sha (status=$run_status, conclusion=$conclusion). Refusing to deploy."
            exit 1
          fi

  deploy:
    name: Deploy (NOT YET CONFIGURED)
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    environment: production  # requires a GitHub "production" Environment with required reviewers, configured by a human
    steps:
      - uses: actions/checkout@v4
      - name: Deploy target not configured
        run: |
          echo "::error::No production deploy target is configured yet."
          echo "This job intentionally fails until a human completes the steps in docs/deploy.md:"
          echo "  - create/confirm the Vercel project (or chosen host) and link it to this repo"
          echo "  - add VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID (or equivalent) as secrets"
          echo "  - set production env vars (NEXT_PUBLIC_API_BASE_URL etc.) in the hosting project"
          echo "  - replace this step with the real deploy command"
          exit 1
        # Example of what this becomes once Vercel is chosen (illustrative only):
        #
        #   - name: Deploy to Vercel (production)
        #     env:
        #       VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        #       VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        #       VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        #     run: npx vercel deploy --prod --token=$VERCEL_TOKEN
